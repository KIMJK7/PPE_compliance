name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
        shell: pwsh

      - name: Build Windows exe
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "PPE_Compliance" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "models;models" `
            --add-data ".env;." `
            --add-data "core;core" `
            --add-data "camera;camera" `
            --add-data "detectors;detectors" `
            --add-data "pipeline;pipeline" `
            --add-data "alerts;alerts" `
            --add-data "reporting;reporting" `
            --add-data "routes;routes" `
            --hidden-import=flask `
            --hidden-import=flask_cors `
            --hidden-import=ultralytics `
            --hidden-import=cv2 `
            --hidden-import=onnxruntime `
            --hidden-import=dotenv `
            --hidden-import=reportlab `
            --hidden-import=smtplib `
            --hidden-import=winsound `
            --collect-all ultralytics `
            --collect-all onnxruntime `
            launcher.py
        shell: pwsh

      - name: Create reports folder
        run: New-Item -ItemType Directory -Force -Path dist\PPE_Compliance\reports
        shell: pwsh

      - name: Create Windows launcher bat
        run: |
          $content = "@echo off`r`ntitle PPE Compliance System`r`ncd /d `"%~dp0`"`r`necho Starting...`r`necho Do NOT close this window!`r`nPPE_Compliance.exe`r`npause"
          [System.IO.File]::WriteAllText("dist\PPE_Compliance\Start PPE Compliance.bat", $content)
        shell: pwsh

      - name: Zip the build
        run: Compress-Archive -Path dist\PPE_Compliance\* -DestinationPath PPE_Compliance_Windows.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPE_Compliance_Windows
          path: PPE_Compliance_Windows.zip
          retention-days: 7
